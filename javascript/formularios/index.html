<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de form</title>
    <script src="js/javascript.js"></script>
</head>
<body>
    <h1>Exemplo de formularuio com javascript</h1>
    <form action="" method="get">
        nome: <input type="text" name="nome" id="nome"><br>
        senha: <input type="password" name="senha" id="senha"><br>
        <input type="checkbox" name="check1" id="check1">
        <label for="check1">Opção 1</label><br>
        <input type="checkbox" name="check2" id="check2">
        <label for="check2">Opção 2</label><br>
        <button type="button" id="btnVerificar">Verificar</button><br>

        <input type="radio" name="radio1" id="radio1" value="r1">
        <label for="radio1">Radio 1</label><br>
        <input type="radio" name="radio1" id="radio2" value="r2">
        <label for="radio2">Radio 2</label><br>
        <input type="radio" name="radio1" id="radio3" value="r3">
        <label for="radio3">Radio 3</label><br>
        <button type="button" id="btnVerificarRadio">Verificar Radio</button>

        <input type="number" name="num1" id="num1"size="5"> +
        <input type="number" name="num2" id="num2"><br>
        <button type="button" id="btnSomar">=</button>
        <input type="text" name="resultado" id="resultado" readonly><br>
    </form>
</body>
</html>
