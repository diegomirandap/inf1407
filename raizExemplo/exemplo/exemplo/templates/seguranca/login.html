{% extends 'seguranca/base.html' %}

{% block titulo %} Página de login {% endblock %}

{% block conteudo %}
<h2>Login</h2>
<form method="post">
    {% csrf_token %}
    <table class="formulario">
    {{ form.as_p }}
    <tr><td colspan="2"><button type="submit" class="btn btn-primary">Login</button></td></tr>
    </table>
</form>
<a href="{% url 'password_reset' %}">Esqueceu sua senha?</a>
{% endblock %}
