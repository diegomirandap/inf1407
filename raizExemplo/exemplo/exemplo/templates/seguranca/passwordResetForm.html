{% extends "seguranca/base.html" %}
{% block titulo %}Redefinição de Senha{% endblock %}

{% block conteudo %}
<h2>Redefinição de Senha</h2>
<p>Por favor, informe seu endereço de e-mail. Você receberá um e-mail com um link para redefinir sua senha.</p>
<form method="post">
    {% csrf_token %}
    <table class="formulario">
        {{ form.as_table }}
    </table>
    <button type="submit" class="btn btn-primary">Enviar e-mail</button>
</form>
{% endblock %}
