{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %} {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'exemplo/css/estilo.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1> Site Seguro </h1>
    <div>
        <a href="{% url 'home' %}">Home</a>| 
        <a href="{% url 'homeSec' %}">Segurança</a> | 
        <a href="{% url 'registroSec' %}">Registro</a> | 
        {% if user.is_authenticated %}
         <a href="{% url 'meuLogoutSec' %}">Logout</a> |
         <a href="{% url 'passwordChangeSec' %}">Trocar Senha</a> |
         <a href="{% url 'editarPerfilSec' pk=user.id %}">Editar Perfil</a> |
        {% else %}
        <a href="{% url 'loginSec' %}?next={% url 'pagSecretaSec' %}">Login</a> |
        {% endif %}
        Você está logado como {% firstof user.username "visitante" %}
    </div>
    <hr>
    <div>
        {% block conteudo %} {% endblock %}
    </div>
</body>
</html>
